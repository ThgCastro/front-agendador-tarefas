<div class="home-hero">
    <div class="hero-text">
        <h1>Organize suas tarefas de forma simples e poderosa</h1>
        <p>Tenha mais produtividade e clareza no seu dia a dia com nosso agendador de tarefas inteligente</p>
        <div class="hero-actions">
            <button matButton="filled" routerLink="/register">Começe agora</button>
            <button matButton="outlined" routerLink="/login">Já tenho uma conta</button>
        </div>
    </div>
    <div class="hero-image">
        <img [src]="imgHero" alt="">
    </div>
</div>
