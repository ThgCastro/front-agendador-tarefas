<div class="register-component">
    <mat-card>
        <mat-card-header class="padding-m">
            <mat-card-title>Cadastro de Usuário</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nome</mat-label>
                <input matInput placeholder="Digite seu nome completo">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>E-mail</mat-label>
                <input matInput placeholder="Digite seu e-mail">
            </mat-form-field>
            <imput-password-field></imput-password-field>
        </mat-card-content>

        <mat-card-actions>
            <button matButton="elevated" class="full-width">Cadastrar</button>
        </mat-card-actions>
    </mat-card>
</div>
